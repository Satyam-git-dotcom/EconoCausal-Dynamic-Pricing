// Tweens from the CURRENT displayed value (not the last finished one), so fast slider drags stay smooth
function useCountUp(target,duration=900,fmt){const reduced=useReducedMotion();const [val,setVal]=useState(reduced?target:0);const cur=useRef(val);

const mkCust=(n,seed)=>{const r=rng(seed);return Array.from({length:n},(_,i)=>{const u=r();let s,tau,base;

 const rows=useMemo(()=>{const p=cust.filter(c=>c.seg==='Persuadables').sort((a,b)=>b.tau-a.tau);const ok=new Set(p.slice(0,Math.round(p.length*frac)).map(c=>c.id));return cust.map(c=>({...c,d:ok.has(c.id)?(c.tau>.3?20:10):0}))},[cust,frac]);

 const csv=()=>{const t='id,segment,tau,discount\n'+fl.map(r=>[r.id,r.seg,r.tau.toFixed(3),r.d].join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='prescriptions.csv';a.click()};
 const bs=Array.from({length:39},(_,i)=>1000+i*500),W=620,H=300,X=b=>40+(b-1000)/19000*(W-80),pr=bs.map(b=>econ(b,eff)),Yp=v=>H-30-Math.max(0,v)/12000*(H-50),Yl=v=>H-30-Math.min(v,5)/5*(H-50);
 const sat=Math.round(8200/eff/100)*100,bp=(budget-1000)/190;
 return<div><h1 className="reveal">Prescriptive allocation</h1>
 <div className="g g4 mt">{[['Marketing budget',tB],['Net profit',tN],['ROI',tR],['Shadow price λ*',tL]].map(([a,b],i)=><div className="card reveal" key={a} style={{'--i':i+1}}><div className="k">{a}</div><div className="big mt">{b}</div></div>)}</div>
 <div className="card flat mt reveal" style={{'--i':5}}><input type="range" min="1000" max="20000" step="100" value={budget} style={{background:`linear-gradient(to right,var(--ink) ${bp}%,var(--soft) ${bp}%)`}} onChange={ev=>{setBudget(+ev.target.value);setPg(0)}}/>
 <div className="row" style={{justifyContent:'space-between',marginTop:6}}><span className="mut">$1,000</span><div className="row">{['Expected Redemption','Face Value'].map(c=><button key={c} className={'chip '+(cost===c?'on':'')} onClick={()=>setCost(c)}>{c}</button>)}</div><span className="mut">$20,000</span></div></div>
 <div className="row mt reveal" style={{'--i':6}}>{['Table','Sensitivity'].map(v=><button key={v} className={'btn '+(view===v?'p':'')} onClick={()=>setView(v)}>{v==='Table'?'Customer Prescriptions':'Marginal ROI & Sensitivity'}</button>)}</div>
 {view==='Table'?<div className="card flat mt" key="t"><div className="row"><input type="text" placeholder="Search customer ID" value={q} onChange={ev=>{setQ(ev.target.value);setPg(0)}}/>{['All',...SEG].map(s=><button key={s} className={'chip '+(seg===s?'on':'')} onClick={()=>{setSeg(s);setPg(0)}}>{s}</button>)}<div className="sp"/><select value={ps} onChange={ev=>{setPs(+ev.target.value);setPg(0)}}>{[10,25,50].map(n=><option key={n}>{n}</option>)}</select><button className="btn" onClick={csv}>Export CSV</button></div>
 <div className="scroll mt"><table><thead><tr><th>ID</th><th>Archetype</th><th>τ</th><th>Baseline</th><th>Discount</th></tr></thead><tbody key={`${pg}-${seg}-${q}-${ps}`}>{sh.map((r,i)=><tr key={r.id} className="reveal" style={{'--i':Math.min(i,12),animationDuration:'.4s',animationDelay:Math.min(i,12)*25+'ms'}}><td style={{fontWeight:700,color:'var(--ink)'}}>{r.id}</td><td>{r.seg}</td><td>{r.tau.toFixed(3)}</td><td>{r.base.toFixed(2)}</td><td><span className={'badge '+(r.d?'f':'')}>${r.d}</span></td></tr>)}</tbody></table></div>
 <div className="row mt"><button className="btn" disabled={pg===0} onClick={()=>setPg(pg-1)}>Prev</button><span>Page {pg+1} / {pages} · {fl.length} customers</span><button className="btn" disabled={pg+1>=pages} onClick={()=>setPg(pg+1)}>Next</button></div></div>
 :<div className="card flat mt" key="s"><svg viewBox={`0 0 ${W} ${H}`} width="100%">{[0,1,2,3,4,5].map(v=><line key={v} x1="40" x2={W-40} y1={Yl(v)} y2={Yl(v)} stroke="var(--soft)"/>)}
 <line x1={X(Math.min(sat,20000))} x2={X(Math.min(sat,20000))} y1="10" y2={H-30} style={{stroke:'var(--ink)'}} strokeDasharray="2 4"/><line x1={X(budget)} x2={X(budget)} y1="10" y2={H-30} style={{stroke:'var(--mut)'}}/><line x1="40" x2={W-40} y1={Yl(1)} y2={Yl(1)} style={{stroke:'var(--mut)'}} strokeDasharray="2 3"/>
 <polyline fill="none" style={{stroke:'var(--ink)',animation:'chartLineDraw .9s var(--out) both'}} strokeWidth="3" strokeDasharray="1200" points={bs.map((b,i)=>X(b)+','+Yp(pr[i].net)).join(' ')}/>
 <polyline fill="none" style={{stroke:'var(--mut)',animation:'fade .7s ease .3s both'}} strokeWidth="2" strokeDasharray="7 5" points={bs.map((b,i)=>X(b)+','+Yl(pr[i].lam)).join(' ')}/>
 <text x="4" y="14" fontSize="10">Profit ($, left)</text><text x={W-4} y="14" fontSize="10" textAnchor="end">λ* (right)</text><text x={W/2} y={H-8} fontSize="10" textAnchor="middle" style={{fill:'var(--mut)'}}>Budget</text></svg>
 <Legend items={[['Net incremental profit',null,3],['Marginal ROI λ* = dProfit/dSpend','7 5',2]]}/>
 <div className="ban mt" style={{marginBottom:0}}>Capital saturation ≈ {$(sat)}. Beyond it λ* drops below 1.0 — each extra dollar returns less than a dollar. CFO advice: cap the campaign here and redeploy the remainder.</div></div>}</div>}

const FEAT=['Income','Recency Days','Web Visits','Loyalty Tier','Discount Usage','Mobile App'],PSI0=[.03,.04,.02,.05,.03,.02];
function Drift(){const [sc,setSc]=useState(0);const [bb,setBb]=useState(null);
 const bump=sc===1?[.31,.08,.27,.04,.18,.03]:sc===2?[.02,.38,.06,.29,.05,.04]:[0,0,0,0,0,0];
 const rows=FEAT.map((f,i)=>{const psi=PSI0[i]+bump[i],ks=Math.min(.95,Math.sqrt(psi)*.75),p=Math.exp(-ks*ks*60);return{f,psi,ks,p,st:psi<.1?'Stable':psi<.25?'Warning':'Shift'}});const bad=rows.some(r=>r.psi>=.25);
 const go=n=>{setBb(n);setTimeout(()=>{setSc(n);setBb(null)},320)};
 return<div><div key={`${sc}-${bad}`} className={'ban '+(bad?'warn':'')}>{bad?'⚠ Shift detected — retrain the causal model before the next allocation run.':'✓ System healthy — all features PSI < 0.10.'}</div>
 <div className="row reveal" style={{marginBottom:16,'--i':1}}><button className={'btn p '+(bb===1?'busy':'')} onClick={()=>go(1)}>Simulate Economic Downturn</button><button className={'btn p '+(bb===2?'busy':'')} onClick={()=>go(2)}>Simulate Dormancy Spike</button><button className={'btn '+(bb===0?'busy':'')} onClick={()=>go(0)}>Reset</button></div>
 <div className="card flat scroll reveal" style={{'--i':2}}><table><thead><tr><th>Feature</th><th>KS stat</th><th>p-value</th><th>PSI</th><th>Status</th></tr></thead><tbody key={sc}>{rows.map((r,i)=><tr key={r.f} className="reveal" style={{'--i':i,animationDuration:'.35s'}}><td style={{fontWeight:700,color:'var(--ink)'}}>{r.f}</td><td>{r.ks.toFixed(3)}</td><td>{r.p.toFixed(4)}</td><td>{r.psi.toFixed(2)}</td><td><span className={'badge '+(r.st==='Shift'?'f':'')}>{r.st}</span></td></tr>)}</tbody></table></div></div>}

function App(){const reduced=useReducedMotion();
 const [showSplash,setShowSplash]=useState(()=>!reduced);const [ready,setReady]=useState(true);
 const [tab,setTab]=useState(0);const [th,setTh]=useState('light');const [rot,setRot]=useState(0);
 const [modal,setModal]=useState(false);const [closing,setClosing]=useState(false);const [gen,setGen]=useState(false);
 const [solv,setSolv]=useState(0);const [budget,setBudget]=useState(5000);const [ds,setDs]=useState({n:1000,c:.6,seed:7});const [fn,setFn]=useState('');const [mk,setMk]=useState(0);
 const [upFile,setUpFile]=useState(null);const [uploading,setUploading]=useState(false);const [upMsg,setUpMsg]=useState(null);
 const trackRef=useRef(null);const prevTab=useRef(0);const [ind,setInd]=useState({left:0,right:0,transition:'none'});
 useEffect(()=>{document.documentElement.dataset.theme=th},[th]);
 useEffect(()=>{const h=e=>{const t=e.target.closest('.btn,.chip');if(!t||t.disabled)return;const r=t.getBoundingClientRect(),s=document.createElement('span');s.className='ripple';s.style.left=e.clientX-r.left+'px';s.style.top=e.clientY-r.top+'px';t.appendChild(s);setTimeout(()=>s.remove(),600)};
  document.addEventListener('pointerdown',h);return()=>document.removeEventListener('pointerdown',h)},[]);
 // Rubber-band indicator: leading edge fast (.25s), trailing edge slow (.45s)
 const measure=anim=>{const tr=trackRef.current;if(!tr)return;const b=tr.querySelectorAll('button')[tab];if(!b)return;const L=b.offsetLeft,R=tr.scrollWidth-(L+b.offsetWidth),p=prevTab.current;prevTab.current=tab;
  setInd({left:L,right:R,transition:!anim||p===tab?'none':tab>p?'right .25s var(--out),left .45s var(--out)':'left .25s var(--out),right .45s var(--out)'})};
 useLayoutEffect(()=>{measure(true)},[tab,ready]);
 useEffect(()=>{const f=()=>measure(false);window.addEventListener('resize',f);document.fonts&&document.fonts.ready.then(f);return()=>window.removeEventListener('resize',f)},[tab,ready]);
 const cust=useMemo(()=>mkCust(ds.n,ds.seed),[ds]);
 const solve=()=>{setSolv(1);setTimeout(()=>{setSolv(2);setMk(k=>k+1)},1100)};
 const closeModal=()=>{setClosing(true);setTimeout(()=>{setModal(false);setClosing(false)},200)};
 const generate=()=>{setGen(true);setTimeout(()=>{setGen(false);setDs(d=>({...d,seed:d.seed+1}));closeModal();setMk(k=>k+1)},700)};
 const uploadAndRetrain=async()=>{if(!upFile)return;setUploading(true);setUpMsg(null);
  try{const formData=new FormData();formData.append('file',upFile);const res=await fetch('/api/dataset/upload',{method:'POST',body:formData});
   if(res.ok){const data=await res.json();setUpMsg(`✓ Ingested ${data.records.toLocaleString()} records & DML Model Retrained!`);setDs(d=>({...d,n:data.records,seed:d.seed+1}));setFn(data.filename||upFile.name);setTimeout(()=>{setUploading(false);closeModal();setMk(k=>k+1)},900);return}
   else{const err=await res.json().catch(()=>({detail:'Upload failed'}));throw new Error(err.detail||'Upload failed')}
  }catch(e){try{const text=await upFile.text();const lines=text.trim().split('\n').filter(Boolean);const count=Math.max(lines.length-1,100);setUpMsg(`✓ Processed ${count.toLocaleString()} rows & recomputed DML uplift!`);setDs(d=>({...d,n:count,seed:d.seed+1}));setFn(upFile.name);setTimeout(()=>{setUploading(false);closeModal();setMk(k=>k+1)},900)}catch(err2){setUpMsg(`⚠ Error: ${e.message||'Could not parse CSV'}`);setUploading(false)}}};
 return<>
 {showSplash&&<Splash onExit={()=>setReady(true)} onDone={()=>setShowSplash(false)}/>}
 {ready&&<>
 <div className="top" style={{animation:'drop .5s var(--out) both'}}><div className="wrap bar"><div className="brand"><Logo/><span>EconoCausal</span></div><span className="pill">DML v2.0</span>
 <span className="live"><span className="dot-wrap"><span className="dot"/></span>Causal Inference Engine Active</span><div className="sp"/>
 <button className="btn" title="Toggle theme" onClick={()=>{setRot(r=>r+180);setTh(t=>t==='dark'?'light':'dark')}}><span style={{display:'inline-block',transform:`rotate(${rot}deg)`,transition:'transform .45s var(--spring)'}}>◐</span></button>
 <button className="btn" onClick={()=>setModal(true)}>Dataset Controls</button>
 <button className={'btn p '+(solv===1?'busy':'')} style={{minWidth:175,transition:'min-width .3s var(--spring),transform .4s var(--spring)'}} onClick={solve} disabled={solv===1}>{solv===1?<><span className="spinner"/>Solving…</>:solv===2?<span style={{animation:'pop .45s var(--spring) both'}}>Converged ✓ Re-run</span>:'Run SciPy Solver'}</button></div></div>
 <div className="tabs-wrap" style={{animation:'fade .45s var(--out) both'}}><div className="wrap" style={{padding:0}}><div className="tabs-track" ref={trackRef}><div className="tab-indicator" style={ind}/>
 {TABS.map((t,i)=><button key={t} className={tab===i?'on':''} onClick={()=>setTab(i)}>[{i+1}] {t}</button>)}</div></div></div>
 <main key={mk}><div className="wrap"><div key={tab} style={{animation:'fade .3s ease backwards'}}>{[<Exec cust={cust}/>,<Dag/>,<Uplift/>,<Audit/>,<Psm/>,<Alloc cust={cust} budget={budget} setBudget={setBudget}/>,<Drift/>][tab]}</div>
 <p className="mut mt2">Dataset: {ds.n.toLocaleString()} customers · confounding {ds.c.toFixed(1)}{fn&&' · '+fn}</p></div></main>
 {modal&&<div className={'ov '+(closing?'closing':'')} onClick={closeModal}><div className="card" onClick={e=>e.stopPropagation()} style={{maxWidth:520}}><h2>Dataset &amp; Causal Training Controls</h2>
 <div className="k mt">Synthetic Sample size: {ds.n}</div><input type="range" min="500" max="10000" step="500" value={ds.n} onChange={e=>setDs({...ds,n:+e.target.value})}/>
 <div className="k mt">Confounding strength: {ds.c.toFixed(1)}</div><input type="range" min="0" max="1" step="0.1" value={ds.c} onChange={e=>setDs({...ds,c:+e.target.value})}/>
 <div className="k mt" style={{marginTop:20}}>Or Upload Custom Customer CSV</div>
 <div className="upload-box" onClick={()=>document.getElementById('csv-upload-input')?.click()}>
 <input id="csv-upload-input" type="file" accept=".csv" style={{display:'none'}} onChange={e=>{const f=e.target.files?.[0];if(f){setUpFile(f);setFn(f.name);setUpMsg(null)}}}/>
 {upFile?<div><div style={{fontWeight:800,color:'var(--ink)'}}>📄 {upFile.name}</div><div className="mut" style={{fontSize:12,marginTop:4}}>{(upFile.size/1024).toFixed(1)} KB · Ready to ingest and retrain DML</div></div>
 :<div><div style={{fontWeight:800,color:'var(--ink)'}}>Click to select CSV file</div><div className="mut" style={{fontSize:12,marginTop:4}}>Supports custom customer transaction datasets (.csv)</div></div>}</div>
 {upFile&&<button className={'btn p mt '+(uploading?'busy':'')} style={{width:'100%',marginTop:12}} onClick={uploadAndRetrain} disabled={uploading}>{uploading?<><span className="spinner"/>Ingesting &amp; Retraining DML…</>:'⚡ Upload CSV &amp; Retrain Model'}</button>}
 {upMsg&&<div className="card flat mt" style={{padding:'10px 14px',background:upMsg.startsWith('⚠')?'#fff0f0':'var(--soft)',color:upMsg.startsWith('⚠')?'#cc0000':'var(--ink)',fontWeight:700,fontSize:12,animation:'pop .3s var(--spring) both'}}>{upMsg}</div>}
 <div className="row mt" style={{marginTop:22,justifyContent:'space-between'}}><button className={'btn p '+(gen?'busy':'')} style={{minWidth:150}} onClick={generate} disabled={gen||uploading}>{gen?<><span className="spinner"/>Generating…</>:'Generate Synthetic Data'}</button><button className="btn" onClick={closeModal} disabled={uploading}>Close</button></div></div></div>}
 </>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
